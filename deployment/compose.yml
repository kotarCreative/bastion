name: bastion-test

x-bastion-service: &bastion-service
  build:
    context: ..
    dockerfile: Dockerfile
  image: bastion:test
  environment: &bastion-environment
    BASTION_DATA_DIR: /var/lib/bastion
    BASTION_ROOT: /var/lib/bastion/host
    BASTION_BOOTSTRAP_ADMIN_EMAIL: ${BASTION_BOOTSTRAP_ADMIN_EMAIL:?set the initial admin email}
    CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set Clerk publishable key}
    CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set Clerk secret key}
    CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?set the exact HTTPS origin}
  volumes:
    - bastion-data:/var/lib/bastion
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=268435456,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  networks:
    - bastion

services:
  bastion-web:
    <<: *bastion-service
    command:
      - gunicorn
      - --bind=0.0.0.0:8000
      - --workers=1
      - --threads=16
      - --worker-class=gthread
      - --timeout=660
      - --graceful-timeout=30
      - --access-logfile=-
      - --error-logfile=-
      - wsgi:app
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      BASTION_HOST: ${BASTION_HOST:-localhost}
    ports:
      - "${BASTION_HTTP_PORT:-8080}:80"
      - "${BASTION_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      bastion-web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bastion

  bootstrap:
    <<: *bastion-service
    command: ["python", "deployment/bootstrap-host.py"]
    restart: "no"
    profiles: ["tools"]

  cli:
    <<: *bastion-service
    command: ["python", "forge.py", "--help"]
    restart: "no"
    profiles: ["tools"]

volumes:
  bastion-data:
  caddy-data:
  caddy-config:

networks:
  bastion:
