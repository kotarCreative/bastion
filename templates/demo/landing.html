{% extends "base.html" %}

{% block title %}Enter token — Bastion Demo{% endblock %}

{% block content %}
<p>This is an invite-only demonstration. Enter the token you were given to see the repository from that view.</p>

<form method="post" action="{{ url_for('login') }}">
  <label for="token">Token</label>
  <input id="token" name="token" type="password" size="50" required autofocus>
  <button type="submit">Enter</button>
</form>
{% endblock %}
