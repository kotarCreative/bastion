<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bastion Demo{% endblock %}</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #222;
      line-height: 1.5;
    }
    header {
      border-bottom: 1px solid #ccc;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
    }
    header h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
    }
    nav a {
      margin-right: 1rem;
      text-decoration: none;
    }
    nav a:hover {
      text-decoration: underline;
    }
    .error { color: #c00; }
    .success { color: #080; }
    .muted { color: #666; }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 1rem;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.4rem 0.6rem;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f6f6f6; }
    code {
      background: #f4f4f4;
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
      word-break: break-all;
    }
    form label {
      display: block;
      margin: 0.75rem 0 0.25rem 0;
    }
    input[type="text"], input[type="password"], select {
      padding: 0.4rem;
      font: inherit;
      min-width: 20rem;
    }
    button {
      padding: 0.4rem 1rem;
      font: inherit;
      margin-top: 0.75rem;
    }
    ul.flashes {
      list-style: none;
      padding: 0;
    }
    ul.flashes li {
      padding: 0.5rem;
      border: 1px solid #ccc;
      margin-bottom: 0.5rem;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Bastion permission demo</h1>
    <nav>
      <a href="{{ url_for('whoami') }}">Whoami</a>
      <a href="{{ url_for('evaluate') }}">Evaluate</a>
      <a href="{{ url_for('browse') }}">Browse</a>
      <a href="{{ url_for('history') }}">History</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flashes">
      {% for category, message in messages %}
        <li class="{{ category }}">{{ message }}</li>
      {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
