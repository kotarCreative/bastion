name: AWS dev deployment

on:
  workflow_dispatch:
    inputs:
      operator_cidr:
        description: Optional operator IPv4 /32 for temporary HTTP access
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: aws-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: aws-dev
    outputs:
      bucket: ${{ steps.outputs.outputs.bucket }}
      owner: ${{ steps.outputs.outputs.owner }}
      region: ${{ steps.outputs.outputs.region }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require successful CI for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f "head_sha=${GITHUB_SHA}" \
            -f status=success \
            -f per_page=1 \
            --jq '.total_count')
          test "$count" -gt 0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.3
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-duration-seconds: 7200
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: bastion-deploy-${{ github.run_id }}
      - name: Require bootstrap outputs
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          PERMISSIONS_BOUNDARY_ARN: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}
        run: |
          test -n "$AWS_ROLE_ARN"
          test -n "$AWS_REGION"
          test -n "$TF_STATE_BUCKET"
          test -n "$TF_STATE_KEY"
          test -n "$PERMISSIONS_BOUNDARY_ARN"
      - name: Initialize Terraform backend
        run: |
          terraform -chdir=deployment/terraform/aws init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Build deployment variables
        env:
          OPERATOR_CIDR: ${{ inputs.operator_cidr }}
          PERMISSIONS_BOUNDARY_ARN: ${{ vars.PERMISSIONS_BOUNDARY_ARN }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
        run: |
          python - <<'PY'
          import ipaddress
          import json
          import os
          import urllib.request

          config = {
              "environment": "dev",
              "aws_region": os.environ["AWS_REGION"],
              "permissions_boundary_arn": os.environ["PERMISSIONS_BOUNDARY_ARN"],
              "s3_object_prefix": "dev",
          }
          certificate = os.environ.get("ACM_CERTIFICATE_ARN", "")
          domain = os.environ.get("DOMAIN_NAME", "")
          if certificate or domain:
              if not certificate or not domain:
                  raise SystemExit("DOMAIN_NAME and ACM_CERTIFICATE_ARN must be configured together")
              config["domain_name"] = domain
              config["acm_certificate_arn"] = certificate
              if os.environ.get("HOSTED_ZONE_ID"):
                  config["hosted_zone_id"] = os.environ["HOSTED_ZONE_ID"]
          else:
              runner_ip = urllib.request.urlopen(
                  "https://checkip.amazonaws.com", timeout=10
              ).read().decode().strip()
              cidrs = [f"{ipaddress.ip_address(runner_ip)}/32"]
              operator = os.environ.get("OPERATOR_CIDR", "").strip()
              if operator:
                  network = ipaddress.ip_network(operator, strict=True)
                  if network.version != 4 or network.prefixlen != 32:
                      raise SystemExit("operator_cidr must be an IPv4 /32")
                  cidrs.append(str(network))
              config["http_ingress_cidrs"] = sorted(set(cidrs))
          with open("/tmp/bastion-dev.tfvars.json", "w", encoding="utf-8") as output:
              json.dump(config, output)
          PY
      - name: Deploy immutable image and service
        env:
          TF_CLI_ARGS_apply: -auto-approve -input=false
        run: deployment/terraform/aws/deploy-dev.sh /tmp/bastion-dev.tfvars.json
      - name: Smoke test deployed service
        run: |
          secret_arn=$(terraform -chdir=deployment/terraform/aws output -raw bootstrap_tokens_secret_arn)
          token_json=$(aws secretsmanager get-secret-value \
            --region "$AWS_REGION" \
            --secret-id "$secret_arn" \
            --query SecretString \
            --output text)
          tester=$(python -c 'import json,sys; print(json.load(sys.stdin)["tester_token"])' <<<"$token_json")
          observer=$(python -c 'import json,sys; print(json.load(sys.stdin)["observer_token"])' <<<"$token_json")
          echo "::add-mask::$tester"
          echo "::add-mask::$observer"
          BASTION_URL=$(terraform -chdir=deployment/terraform/aws output -raw bastion_url) \
          BASTION_TESTER_TOKEN="$tester" \
          BASTION_OBSERVER_TOKEN="$observer" \
          BASTION_INSECURE_TLS=0 \
            deployment/terraform/aws/smoke-test.sh
      - name: Export qualification inputs
        id: outputs
        run: |
          {
            echo "bucket=$(terraform -chdir=deployment/terraform/aws output -raw repository_bucket)"
            echo "owner=$(terraform -chdir=deployment/terraform/aws output -raw repository_bucket_owner)"
            echo "region=$(terraform -chdir=deployment/terraform/aws output -raw aws_region)"
          } >>"$GITHUB_OUTPUT"

  qualify:
    needs: deploy
    uses: ./.github/workflows/aws-s3-qualification.yml
    with:
      bucket: ${{ needs.deploy.outputs.bucket }}
      owner: ${{ needs.deploy.outputs.owner }}
      region: ${{ needs.deploy.outputs.region }}
