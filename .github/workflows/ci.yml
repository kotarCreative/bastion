name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check poetry==2.4.3
          poetry install --no-interaction
      - name: Run full test suite
        run: poetry run python -m unittest discover -s tests -t . -v

  cloudflare:
    name: Cloudflare catalog and recovery tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deployment/cloudflare/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check poetry==2.4.3
          poetry install --no-interaction
          npm ci --prefix deployment/cloudflare
      - name: Check Worker and catalog transactions
        working-directory: deployment/cloudflare
        run: |
          npm run check
          npm test
          npx wrangler deploy --dry-run --containers-rollout=none
      - name: Check Python backend, migration, and cold recovery
        run: poetry run python -m unittest tests.test_durable_objects -v

  postgres:
    name: PostgreSQL storage tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BASTION_TEST_PG: postgresql://postgres:postgres@127.0.0.1:5432
      BASTION_ADMIN_DATABASE: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      BASTION_DATABASE: postgresql://bastion_runtime:runtime-test-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check poetry==2.4.3
          poetry install --no-interaction
      - name: Run storage backend matrix
        run: |
          poetry run python deployment/provision-postgres.py /var/lib/bastion/forge
          poetry run python - <<'PY'
          import hashlib
          import psycopg

          database = "bastion_" + hashlib.sha256(b"/var/lib/bastion/forge").hexdigest()[:16]
          dsn = f"postgresql://bastion_runtime:runtime-test-password@127.0.0.1:5432/{database}"
          with psycopg.connect(dsn, autocommit=True) as connection:
              role = connection.execute(
                  "SELECT current_user, rolcreatedb, rolsuper FROM pg_roles WHERE rolname = current_user"
              ).fetchone()
              assert role == ("bastion_runtime", False, False), role
              try:
                  connection.execute("CREATE DATABASE must_not_succeed")
              except psycopg.errors.InsufficientPrivilege:
                  pass
              else:
                  raise AssertionError("runtime role unexpectedly created a database")
          PY
          poetry run python -m unittest tests.test_storage -v

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.3
      - name: Check formatting
        run: terraform fmt -check -recursive deployment/terraform
      - name: Initialize and validate roots
        shell: bash
        run: |
          roots=(deployment/terraform/aws-state deployment/terraform/aws)
          for root in "${roots[@]}"; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
      - name: Check deployment shell syntax
        run: |
          bash -n deployment/terraform/bootstrap-aws.sh
          bash -n deployment/terraform/aws/deploy-dev.sh
          bash -n deployment/terraform/aws/init-forge.sh

  container:
    name: Docker and Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build --tag bastion:ci .
      - name: Validate Compose files
        run: |
          docker compose -f deployment/compose.yml config --quiet
          docker compose -f deployment/compose.postgres-test.yml config --quiet
